[project]
name = "cyber-rag-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=1.4.1",
    "fastapi>=0.128.0",
    "langchain-chroma>=0.2.6",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.11",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
extract = [
    "pdf2image>=1.17.0",
    "pillow>=11.3.0",
    "pytesseract>=0.3.13",
    "pythainlp>=5.2.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "unstructured[pdf]>=0.18.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
